name: my_flutter_app
description: "Local video app"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_riverpod: ^3.0.3
  google_fonts: ^6.3.2
  http: ^1.5.0
  animated_background: ^2.0.0
  video_player: ^2.6.1
  video_thumbnail: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/thumbnails/

